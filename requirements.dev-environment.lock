# TalkSense AI - DEVELOPMENT TOOLING ENVIRONMENT LOCK (root venv/)
# ============================================================================
#
# WHAT THIS FILE IS
#   A verbatim record of the packages installed in the repository-root venv/ at
#   the time of capture. It is a SNAPSHOT, NOT the output of a fresh dependency
#   resolution. It exists so the tooling environment is reconstructible, and so
#   that any future drift between the two environments is visible in git.
#
# CAPTURED
#   Date        : 2026-09-09
#   Command     : venv/Scripts/python.exe -m pip freeze --all
#   Interpreter : CPython 3.12.8 (cp312)
#   Platform    : win_amd64
#   Role        : development tooling only - pytest, ruff, black, pyright.
#                 This is the environment used by the verification commands in
#                 CLAUDE.md.
#
# THIS IS NOT THE BACKEND RUNTIME
#   Do not start the backend from this environment. It is a second, divergent
#   copy of the AI stack and is NOT the environment the frozen IB 1.5s ASR
#   configuration was validated against. Known divergences from
#   backend/requirements.runtime.lock at capture time:
#       ctranslate2     4.8.0        (runtime: 4.8.2)
#       transformers    5.12.1       (runtime: 5.16.1)
#       numpy           2.4.6        (runtime: 2.5.3)
#       scipy           1.18.0       (runtime: 1.18.1)
#       av              17.1.0       (runtime: 18.1.0)
#       onnxruntime     1.27.0       (runtime: 1.29.0)
#       torch           2.11.0+cu128 (runtime: 2.14.0, CPU build on win_amd64)
#   It also carries pyannote-audio, matplotlib, pandas and scikit-learn, none
#   of which are in the production runtime, and it has none of the nvidia-*
#   CUDA wheels that CTranslate2 needs on Windows.
#
#   The canonical backend runtime is backend/venv, recorded in
#   backend/requirements.runtime.lock. Start the backend only via
#   backend/start_backend.ps1.
#
# INDEX / WHEEL PROVENANCE
#   Every package below was installed from an index; no dist-info contains a
#   direct_url.json, and there are no editable, VCS, or local file installs.
#
#   These three lines carry +cu128 local version tags and are NOT installable
#   from PyPI:
#       torch==2.11.0+cu128
#       torchaudio==2.11.0+cu128
#       torchvision==0.26.0+cu128
#   Reproducing them requires the PyTorch CUDA 12.8 index:
#       pip install torch==2.11.0+cu128 torchaudio==2.11.0+cu128 \
#           torchvision==0.26.0+cu128 \
#           --index-url https://download.pytorch.org/whl/cu128
#   In this environment torch.cuda.is_available() is True and
#   torch.version.cuda is '12.8'.
#
# RULES
#   - Do not hand-edit. Regenerate only by re-running pip freeze.
#   - As of this commit, this file is a record only. It is not yet used to
#     build any environment, and venv/ has not been modified.
#   - Development analyzer versions that CI must match are pinned separately in
#     backend/requirements-dev.txt.
#
