# ============================================================================
# TalkSense AI - CANONICAL BACKEND RUNTIME LOCK
# ============================================================================
#
# WHAT THIS FILE IS
#   A verbatim record of the packages installed in backend/venv at the time of
#   capture. It is a SNAPSHOT of a known-good environment, NOT the output of a
#   fresh dependency resolution. backend/requirements.txt remains the abstract
#   dependency specification; this file is the concrete record of what was
#   actually installed and validated.
#
#   This is the environment the frozen IB 1.5s ASR configuration was validated
#   against. Treat every pin below as accuracy-critical.
#
# CAPTURED
#   Date        : 2026-09-09
#   Command     : backend/venv/Scripts/python.exe -m pip freeze --all
#   Interpreter : CPython 3.12.8 (cp312)
#   Platform    : win_amd64
#   Role        : canonical backend runtime, launched by backend/start_backend.ps1
#
# INDEX / WHEEL PROVENANCE
#   Every package below was installed from the default index (PyPI). No
#   dist-info contains a direct_url.json; there are no editable, VCS, or local
#   file installs.
#
#   torch==2.14.0 and torchaudio==2.11.0 carry no local version tag in their
#   installed metadata, but the builds report:
#       torch.__version__      == '2.14.0+cpu'
#       torchaudio.__version__ == '2.11.0+cpu'
#   On win_amd64 the default PyPI wheel IS the CPU build, so these lines
#   reproduce the environment as-is on Windows. On linux_x86_64 the same
#   version strings resolve to the CUDA-bundled wheels, so THIS FILE DOES NOT
#   REPRODUCE THE SAME RUNTIME ON LINUX. A Linux rebuild must install torch and
#   torchaudio from https://download.pytorch.org/whl/cpu to match.
#
#   torch.cuda.is_available() is False in this environment. That is expected
#   and correct: no part of the production pipeline uses torch CUDA. Whisper
#   reaches the GPU through CTranslate2 (below), Silero VAD is CPU by locked
#   decision, and the sentiment pipeline is constructed without a device
#   argument and therefore runs on CPU.
#
# CUDA RUNTIME FOR WHISPER (REQUIRED, NOT SUPPLIED BY TORCH)
#   GPU transcription is provided by ctranslate2==4.8.2 (via
#   faster-whisper==1.2.1) using the CUDA libraries shipped as these three
#   win_amd64 PyPI wheels, pinned below:
#       nvidia-cublas-cu12==12.9.2.10
#       nvidia-cuda-nvrtc-cu12==12.9.86
#       nvidia-cudnn-cu12==9.25.1.1
#   On Windows these DLLs are not on the loader search path by default.
#   backend/start_backend.ps1 prepends both directories to PATH:
#       backend/venv/Lib/site-packages/nvidia/cublas/bin
#       backend/venv/Lib/site-packages/nvidia/cudnn/bin
#   Starting the backend by any other means will not find them, and CUDA
#   Whisper will fail to initialise. Always start via start_backend.ps1.
#
# NOT CAPTURED BY THIS FILE (remaining reproducibility gaps)
#   - Whisper model weights: faster-whisper resolves WHISPER_MODEL ('small')
#     from the HuggingFace cache with no revision pin.
#   - Silero VAD: loaded via torch.hub.load('snakers4/silero-vad') with no tag
#     or commit, i.e. the repository default branch.
#   - Host NVIDIA driver / CUDA driver version.
#
# RULES
#   - Do not hand-edit. Regenerate only by re-running pip freeze against an
#     environment that has itself been validated.
#   - Reinstalling from this file, or changing any pin in it, moves the ASR
#     stack and requires L4 accuracy regression before it is accepted.
#   - As of this commit, this file is a record only. It is not yet used to
#     build any environment, and backend/venv has not been modified.
#
# ============================================================================

