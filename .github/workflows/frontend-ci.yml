name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Lint, Build, and E2E Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: talksense-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: talksense-ui/package-lock.json

      - name: Install Dependencies
        # npm ci performs a clean install, aborts if lockfile is out of sync, and skips expensive audits
        run: npm ci

      - name: Security Check
        run: npm audit --audit-level=high || true # Warns on high vulnerabilities without blocking build

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          # Environment variables can remain blank for static bundle generation
          VITE_WS_URL: ""
          VITE_API_URL: ""

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          VITE_WS_URL: "ws://localhost:8000"
          VITE_API_URL: "http://localhost:8000"

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: talksense-ui/dist/
          retention-days: 14

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() # Upload reports even if tests fail
        with:
          name: playwright-report
          path: talksense-ui/playwright-report/
          retention-days: 14
