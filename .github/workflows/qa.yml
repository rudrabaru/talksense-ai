name: QA Pipeline

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: talksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'talksense-ui/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: talksense-ui
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: talksense-ui
        run: npx playwright install chromium --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Backend .env
        working-directory: backend
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://postgres:password@localhost:5432/talksense" > .env
          echo "JWT_SECRET_KEY=testsecretkey" >> .env
          echo "JWT_ALGORITHM=HS256" >> .env
          echo "JWT_EXPIRE_MINUTES=1440" >> .env
          echo "WHISPER_MODEL=tiny" >> .env
          echo "WHISPER_COMPUTE_TYPE=int8" >> .env
          echo "WHISPER_DEVICE=cpu" >> .env
          echo "PYANNOTE_ENABLED=false" >> .env
          echo "ENV=test" >> .env
          echo "CORS_ORIGINS=http://localhost:5173" >> .env

      - name: Start Backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be healthy
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8000/health)" != "200" ]]; do sleep 2; done' || false
        
      - name: Run Playwright Tests
        working-directory: talksense-ui
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: talksense-ui/playwright-report/
          retention-days: 30
