name: QA Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run QA against'
        required: true
        default: 'staging'
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM
  release:
    types: [published]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 1: Static & Unit Quality
  # ==========================================
  quality-gate:
    name: Core Unit & DB Quality
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense_test
      JWT_SECRET_KEY: qa_test_secret
      JWT_ALGORITHM: HS256
      WHISPER_DEVICE: cpu
      PYANNOTE_DEVICE: cpu
      HF_TOKEN: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install System & Python Deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Database Schema Validation
        working-directory: backend
        run: alembic upgrade head

      - name: Run Core Unit Tests
        working-directory: backend
        # Ignore integration, stress, and forensic scripts
        run: |
          pytest tests/ \
            --ignore=tests/smoke_test_ws.py \
            --ignore=tests/long_session_runner.py \
            --ignore=tests/test_runtime_crash.py \
            --ignore=tests/run_10055_forensics.py \
            --ignore=tests/validate_pipeline.py \
            --junitxml=unit-test-results.xml

      - name: Upload Unit Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-unit-results
          path: backend/unit-test-results.xml

  # ==========================================
  # STAGE 2: API & Integration Quality
  # ==========================================
  api-integration:
    name: API & WebSocket Integration
    needs: quality-gate
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense_qa
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense_qa
      JWT_SECRET_KEY: qa_test_secret
      WHISPER_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
      
      - name: Install Deps & DB
        run: |
          sudo apt-get install -y ffmpeg libsndfile1 curl
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          cd backend && alembic upgrade head

      - name: Launch Backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend_qa.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 10 # Allow boot time

      - name: Execute WebSocket Smoke Tests
        working-directory: backend
        run: python tests/smoke_test_ws.py

      - name: Upload Server Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-server-logs
          path: backend/backend_qa.log

  # ==========================================
  # STAGE 3: E2E Browser Automation
  # ==========================================
  e2e-browser:
    name: Frontend E2E (Playwright)
    needs: api-integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: talksense-ui/package-lock.json

      - name: Install Frontend Deps
        working-directory: talksense-ui
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E Suite (Mocked APIs)
        working-directory: talksense-ui
        run: npm run test:e2e
        env:
          VITE_WS_URL: "ws://localhost:8000"
          VITE_API_URL: "http://localhost:8000"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-playwright-report
          path: talksense-ui/playwright-report/
