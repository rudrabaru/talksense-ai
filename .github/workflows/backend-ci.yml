name: Backend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-and-lint:
    name: Lint, Test, and Coverage
    runs-on: ubuntu-22.04
    
    # 1. Spin up a real Postgres instance identical to production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 2. Inject Deterministic CI Variables
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense_test
      JWT_SECRET_KEY: "dummy_ci_secret_key_for_testing_only_123456"
      JWT_ALGORITHM: HS256
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' # Automatically caches pip dependencies based on requirements.txt

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Black (Formatting Check)
        run: black --check backend/

      - name: Run Ruff (Linting Check)
        run: ruff check backend/

      - name: Run Pyright (Type Checking)
        run: pyright backend/

      - name: Run Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Pytest Suite (Unit Tests Only)
        run: |
          cd backend
          # Explicitly ignore benchmark/stress test files that require GPU or active servers
          pytest tests/ \
            --ignore=tests/smoke_test_ws.py \
            --ignore=tests/long_session_runner.py \
            --ignore=tests/run_verification.py \
            --ignore=tests/validate_pipeline.py \
            --ignore=tests/run_10055_forensics.py \
            --cov=. \
            --cov-report=xml \
            --junitxml=test-results.xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 14