name: Backend CI

on:
  push:
    branches:
      - dev
      - main
      - temp-ci-test

  pull_request:
    branches:
      - dev
      - main
      - temp-ci-test

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pyright
        run: pyright

      - name: Create database tables
        run: python -c "import asyncio; from db.database import create_all; asyncio.run(create_all())"

      - name: Run server and tests
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          # Wait for server to be healthy
          for i in {1..30}; do
            curl -s http://127.0.0.1:8000/health && break
            sleep 1
          done
          pytest --cov=. --cov-report=term --cov-report=xml
        env:
          ENV: test
          JWT_SECRET_KEY: test_secret_key_123_test_secret_key_123_test
          HF_TOKEN: ""
          GEMINI_API_KEY: ""

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
