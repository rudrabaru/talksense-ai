name: Integration CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: End-to-End Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      PYTHONUNBUFFERED: "1"

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense

      JWT_SECRET_KEY: integration_test_secret_key

      HF_TOKEN: ""

      GEMINI_API_KEY: ""

    steps:

      #########################################################
      # Checkout
      #########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # Python
      #########################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 curl

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install requests websockets

      #########################################################
      # Database
      #########################################################

      - name: Create Database
        working-directory: backend
        run: |
          python -c "import asyncio; from db.database import create_all; asyncio.run(create_all())"

      #########################################################
      # Node
      #########################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: talksense-ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: talksense-ui
        run: npm ci

      #########################################################
      # Frontend Build Verification
      #########################################################

      - name: Verify Frontend Build
        working-directory: talksense-ui
        run: npm run build

      #########################################################
      # Launch Backend
      #########################################################

      - name: Launch Backend
        working-directory: backend
        run: |
          python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &

          echo $! > uvicorn.pid

      #########################################################
      # Wait For Startup
      #########################################################

      - name: Wait For Backend Startup
        working-directory: backend
        run: |

          echo "Waiting for backend..."

          SUCCESS=false

          for i in {1..120}; do

            if curl -s http://127.0.0.1:8000/health > health.json; then

              if grep -qi "healthy" health.json || grep -qi "ok" health.json; then
                SUCCESS=true
                break
              fi

            fi

            sleep 1

          done

          if [ "$SUCCESS" != "true" ]; then

            echo "Backend failed to start."

            cat backend.log

            exit 1

          fi

      #########################################################
      # Startup Information
      #########################################################

      - name: Print Runtime Information
        working-directory: backend
        run: |
          python --version
          pip --version

      #########################################################
      # API Smoke Tests
      #########################################################

      - name: Verify Health Endpoint
        run: |
          curl --fail http://127.0.0.1:8000/health

      - name: Verify Diarizer Endpoint
        run: |
          curl --fail http://127.0.0.1:8000/check_diarizer

      #########################################################
      # Conversation Engine Smoke Test
      #########################################################

      - name: Execute Conversation Engine Smoke Test
        working-directory: backend
        run: |
          python tests/smoke_test_ws.py

      #########################################################
      # Upload Logs
      #########################################################

      - name: Upload Backend Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend/backend.log
            backend/health.json
          retention-days: 7

      #########################################################
      # Shutdown
      #########################################################

      - name: Shutdown Backend
        if: always()
        working-directory: backend
        run: |

          if [ -f uvicorn.pid ]; then

            PID=$(cat uvicorn.pid)

            echo "Stopping uvicorn ($PID)"

            kill $PID || true

            sleep 2

            if ps -p $PID > /dev/null; then

              echo "Force killing backend..."

              kill -9 $PID || true

            fi

          fi

          echo "Shutdown complete."