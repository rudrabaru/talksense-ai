name: Integration CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: End-to-End API Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talksense
      JWT_SECRET_KEY: integration_test_secret_key
      JWT_ALGORITHM: HS256
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      # Explicitly blank to force graceful degradation/mocks
      HF_TOKEN: ""
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: talksense-ui/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 curl

      - name: Install Frontend Dependencies
        working-directory: talksense-ui
        run: npm ci

      - name: Verify Frontend Build
        working-directory: talksense-ui
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Initialize Database Schema
        working-directory: backend
        run: alembic upgrade head

      - name: Launch Backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait For Backend Startup
        working-directory: backend
        run: |
          echo "Waiting for backend..."
          SUCCESS=false
          for i in {1..120}; do
            if curl -s http://127.0.0.1:8000/health > health.json; then
              if grep -qi "healthy" health.json || grep -qi "ok" health.json; then
                SUCCESS=true
                break
              fi
            fi
            sleep 1
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "Backend failed to start."
            cat backend.log
            exit 1
          fi

      - name: Execute API & WebSocket Integration Test
        working-directory: backend
        run: python tests/smoke_test_ws.py

      - name: Upload Backend Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-backend-logs
          path: |
            backend/backend.log
            backend/health.json
          retention-days: 7

      - name: Shutdown Backend
        if: always()
        working-directory: backend
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid) || true
          fi